<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>

        <div class="user-controls">
          <button id="user-menu-btn" class="icon-btn" aria-label="User menu">👤</button>
          <div id="auth-panel" class="auth-panel hidden">
            <p id="auth-status-text">Not logged in</p>
            <button id="open-login-btn" type="button">Login</button>
            <button id="logout-btn" type="button" class="hidden">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <div id="message" class="hidden"></div>

    <div id="login-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Teacher Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Login</button>
            <button id="close-login-btn" type="button" class="secondary">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="register-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Register Student</h3>
        <form id="register-form">
          <div class="form-group">
            <label for="register-activity">Activity</label>
            <input id="register-activity" type="text" readonly />
          </div>
          <div class="form-group">
            <label for="register-email">Student Email</label>
            <input
              id="register-email"
              type="email"
              required
              placeholder="student@mergington.edu"
            />
          </div>
          <div class="modal-actions">
            <button type="submit">Register</button>
            <button id="close-register-btn" type="button" class="secondary">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
